<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>调用 Coze 工作流</title>
    <style>
        .container {
            width: 600px;
            margin: 50px auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .form-item {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #1976D2;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 4px;
            white-space: pre-wrap;
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Coze 工作流调用</h2>
        <div class="form-item">
            <label>产品名称（必填）：</label>
            <input type="text" id="productName" placeholder="比如：无线蓝牙耳机">
        </div>
        <div class="form-item">
            <label>产品价格（必填）：</label>
            <input type="text" id="productPrice" placeholder="比如：99元">
        </div>
        <button onclick="callWorkflow()">调用工作流</button>
        <div id="result"></div>
    </div>

    <script>
        async function callWorkflow() {
            // 1. 获取输入参数
            const productName = document.getElementById('productName').value;
            const productPrice = document.getElementById('productPrice').value;
            
            // 2. 校验必填项
            if (!productName || !productPrice) {
                alert('产品名称和价格不能为空！');
                return;
            }

            // 3. 替换成你自己的 Coze 信息！
            const API_URL = 'https://hhy23495kz.coze.site/run'; // 你的接口地址
            const API_TOKEN = 'eyJhbGciOiJSUzI1NiIsImtpZCI6IjM3N2Q4NzY4LWNmNjMtNDI5ZS05YWE1LWQ2M2E4ZWExNGQxNCJ9.eyJpc3MiOiJodHRwczovL2FwaS5jb3plLmNuIiwiYXVkIjpbIldkYWVJTkZBM0dxc21Hb0hrOHVMYmRwWllDdmNOWXFKIl0sImV4cCI6ODIxMDI2Njg3Njc5OSwiaWF0IjoxNzcwODI5NzA3LCJzdWIiOiJzcGlmZmU6Ly9hcGkuY296ZS5jbi93b3JrbG9hZF9pZGVudGl0eS9pZDo3NjA1NjI5MDEzNjI2MjU3NDU4Iiwic3JjIjoiaW5ib3VuZF9hdXRoX2FjY2Vzc190b2tlbl9pZDo3NjA1NjU1NjgxODczNDc3Njg2In0.I1VpVoWwHaoIaZL0icqtkqRXH0AiClPuqYSJv-7dw5fid-VsW03ya3yAGa3-c3LPAlrOc-2eQAR1A8rcE3eF8cH5nMpDGPMErADOt0pJoaJfYjqq8Eyh_V1mdZoL7-Lckc30tSx-DLpFEuDEovWMOgibcipH1mR39OXVBG9WSOAK2mqFgdI4snT-Vo5PfuYIRyu4CLYCdH4kVvOSEadQHZut8lhaNwyWrkYKJRiZ41U-8566k7IYINHZo1EFs3Ug8UZMDafd8CHOLaAtbkwErkesh1anX369YADMt1n2YJ66etyicFOTC10RtdoehOxjFPOP_A6GesR8fmgU9XeKOQ'; // 你的 Token

            const resultDiv = document.getElementById('result');
            try {
                resultDiv.textContent = '正在调用工作流，请稍等...';
                
                // 4. 发起请求
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        product_name: productName,
                        price: productPrice
                        // 其他参数按需添加：category、specifications 等
                    })
                });

                // 5. 处理结果
                if (!response.ok) {
                    throw new Error(`调用失败：${response.status} ${response.statusText}`);
                }
                const result = await response.json();
                resultDiv.textContent = '调用成功！返回结果：\n' + JSON.stringify(result, null, 2);

            } catch (error) {
                resultDiv.textContent = `调用失败！错误信息：\n${error.message}`;
            }
        }
    </script>
</body>
</html>
